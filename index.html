"], "e": "Đổi λ = 0,4 m; v = λ/T = 2 m/s.", "l": 1}, {"q": "Sóng đi 12 m trong 3 s, f = 8 Hz. Tính λ.", "a": "0,5 m", "opts": ["0,5 m", "2 m", "4 m", "32 m"], "e": "v = 12/3 = 4 m/s; λ = 4/8 = 0,5 m.", "l": 2}, {"q": "v = 6 m/s. Khi nào M cách nguồn 9 m bắt đầu dao động nếu nguồn khởi động lúc t = 0?", "a": "1,5 s", "opts": ["1,5 s", "0,67 s", "54 s", "3 s"], "e": "Thời gian truyền = d/v = 9/6 = 1,5 s.", "l": 2}, {"q": "Trong 2 s sóng truyền 10 bước sóng. Tính f.", "a": "5 Hz", "opts": ["5 Hz", "20 Hz", "0,2 Hz", "10 Hz"], "e": "2 = 10T nên T = 0,2 s, f = 5 Hz.", "l": 2}, {"q": "M, N cùng phương truyền cách 75 cm, λ = 30 cm. Hai điểm thế nào?", "a": "Ngược pha", "opts": ["Ngược pha", "Cùng pha", "Vuông pha", "Lệch π/4"], "e": "Δφ = 2π×75/30 = 5π, tương đương π.", "l": 2}, {"q": "A = 2 cm, f = 5 Hz. Phần tử dao động ổn định đi được bao xa trong 0,6 s?", "a": "24 cm", "opts": ["24 cm", "12 cm", "6 cm", "48 cm"], "e": "T = 0,2 s; 0,6 s = 3T. Mỗi T đi 4A = 8 cm, tổng 24 cm.", "l": 3}, {"q": "Hai điểm cùng pha cách 18 cm trên phương truyền. Giữa chúng có đúng 2 điểm cùng pha với chúng. f = 10 Hz. Tính v.", "a": "0,6 m/s", "opts": ["0,6 m/s", "1,8 m/s", "0,9 m/s", "3,6 m/s"], "e": "Có 3 khoảng λ nên λ = 6 cm = 0,06 m; v = λf = 0,6 m/s.", "l": 3}], "Phương trình sóng": [{"q": "Sóng truyền chiều dương Ox có dạng nào?", "a": "u = A cos(ωt − kx + φ)", "opts": ["u = A cos(ωt − kx + φ)", "u = A cos(ωt + kx + φ)", "u = A cos(kxt)", "u = A cos(ω+x)"], "e": "Tại x, dao động trễ x/v so với nguồn: thay t bằng t − x/v, k = ω/v.", "l": 0}, {"q": "Số sóng k bằng?", "a": "2π/λ", "opts": ["2π/λ", "λ/2π", "2πλ", "1/T"], "e": "k là biến thiên pha trên một đơn vị chiều dài.", "l": 0}, {"q": "Hai điểm gần nhất ngược pha cách nhau?", "a": "λ/2", "opts": ["λ/2", "λ", "λ/4", "2λ"], "e": "Ngược pha khi Δφ = (2n+1)π; giá trị nhỏ nhất cho d = λ/2.", "l": 0}, {"q": "u = 3cos(10πt − 2πx) cm. Biên độ?", "a": "3 cm", "opts": ["3 cm", "10π cm", "2π cm", "6 cm"], "e": "Biên độ là hệ số trước cos.", "l": 0}, {"q": "u = 2cos(20πt − 4πx) cm, x tính bằng m. f?", "a": "10 Hz", "opts": ["10 Hz", "20 Hz", "2 Hz", "4 Hz"], "e": "ω = 20π; f = ω/(2π) = 10 Hz.", "l": 1}, {"q": "u = 2cos(20πt − 4πx) cm, x tính bằng m. λ?", "a": "0,5 m", "opts": ["0,5 m", "4 m", "2 m", "0,25 m"], "e": "k = 4π rad/m; λ = 2π/k = 0,5 m.", "l": 1}, {"q": "u = 4cos(12πt − 3πx) cm, x tính bằng m. v?", "a": "4 m/s", "opts": ["4 m/s", "3 m/s", "12 m/s", "36 m/s"], "e": "v = ω/k = 12π/(3π) = 4 m/s.", "l": 1}, {"q": "Nguồn u₀ = 5cos(10πt) cm, v = 2 m/s. Pha trễ tại M cách nguồn 0,4 m?", "a": "2π", "opts": ["2π", "0,4π", "4π", "π"], "e": "Δt = 0,4/2 = 0,2 s. Pha trễ ωΔt = 10π×0,2 = 2π.", "l": 1}, {"q": "λ = 80 cm. Hai điểm trên phương truyền cách 20 cm có độ lệch pha?", "a": "π/2", "opts": ["π/2", "π", "2π", "π/4"], "e": "Δφ = 2πd/λ = 2π×20/80 = π/2.", "l": 1}, {"q": "u = 4cos(8πt − 2πx) cm, x tính bằng m. Tại x = 0,5 m, t = 0,25 s, u?", "a": "−4 cm", "opts": ["−4 cm", "4 cm", "0 cm", "2 cm"], "e": "Pha = 8π×0,25 − 2π×0,5 = π; u = 4cosπ = −4 cm.", "l": 2}, {"q": "Tại một điểm u = 2cos(10πt) cm. Tốc độ dao động cực đại?", "a": "20π cm/s", "opts": ["20π cm/s", "10π cm/s", "2π cm/s", "5π cm/s"], "e": "vdao động = du/dt; độ lớn cực đại ωA = 20π cm/s. Không phải tốc độ truyền sóng.", "l": 2}, {"q": "Sóng chạy chiều âm Ox, λ = 0,5 m, f = 4 Hz, A = 3 cm, φ = 0. Phương trình (x theo m)?", "a": "u = 3cos(8πt + 4πx) cm", "opts": ["u = 3cos(8πt + 4πx) cm", "u = 3cos(8πt − 4πx) cm", "u = 3cos(4πt + 8πx) cm", "u = 3cos(8πt + 2πx) cm"], "e": "ω = 8π, k = 4π; chiều âm mang dấu cộng trước kx.", "l": 2}, {"q": "Sóng chạy chiều dương. Nguồn có pha π/3, M cách λ/4. Li độ M?", "a": "√3A/2", "opts": ["√3A/2", "A/2", "−A/2", "−√3A/2"], "e": "M trễ π/2; pha M = −π/6. Li độ A cos(−π/6) = √3A/2.", "l": 2}, {"q": "u = 2cos(4πt − πx) cm. Tại x = 0,5 m, thời điểm dương đầu tiên u = +2 cm?", "a": "0,125 s", "opts": ["0,125 s", "0,25 s", "0,5 s", "0,375 s"], "e": "4πt − π/2 = 2nπ. Với n=0, t=1/8 s là nghiệm dương nhỏ nhất.", "l": 3}, {"q": "Sóng chạy chiều dương, λ = 60 cm. Hai điểm M, N cách nhau 10 cm, N xa nguồn hơn. Pha M bằng π/2. N có li độ?", "a": "√3A/2", "opts": ["√3A/2", "−√3A/2", "A/2", "0"], "e": "N trễ 2π×10/60 = π/3. Pha N = π/2 − π/3 = π/6; uN = √3A/2.", "l": 3}], "Sóng âm": [{"q": "Âm trong không khí thuộc loại nào?", "a": "Sóng cơ dọc", "opts": ["Sóng cơ dọc", "Sóng ngang", "Sóng điện từ", "Tia hồng ngoại"], "e": "Không khí có vùng nén, dãn theo phương truyền.", "l": 0}, {"q": "Độ cao của âm phụ thuộc chủ yếu vào gì?", "a": "Tần số", "opts": ["Tần số", "Cường độ", "Khoảng cách", "Tốc độ"], "e": "Tần số càng lớn thường nghe càng cao.", "l": 0}, {"q": "Âm 30 kHz là?", "a": "Siêu âm", "opts": ["Siêu âm", "Hạ âm", "Âm nghe thông thường", "Sóng vô tuyến"], "e": "30 kHz = 30 000 Hz, trên ngưỡng khoảng 20 kHz.", "l": 0}, {"q": "Âm 10 Hz là?", "a": "Hạ âm", "opts": ["Hạ âm", "Siêu âm", "Âm nghe thông thường", "Tia X"], "e": "Hạ âm có f dưới khoảng 20 Hz.", "l": 0}, {"q": "Đơn vị SI cường độ âm?", "a": "W/m²", "opts": ["W/m²", "Hz", "dB", "m/s"], "e": "I = công suất/diện tích. dB là đơn vị mức cường độ âm.", "l": 1}, {"q": "f = 340 Hz, v = 340 m/s. λ?", "a": "1 m", "opts": ["1 m", "0,1 m", "2 m", "340 m"], "e": "λ = v/f = 1 m.", "l": 1}, {"q": "Tiếng vang từ một mặt phản xạ trở về sau 0,4 s; v = 340 m/s. Khoảng cách?", "a": "68 m", "opts": ["68 m", "136 m", "34 m", "85 m"], "e": "Âm đi và về: d = vt/2 = 68 m.", "l": 1}, {"q": "P = 0,02 W qua đều diện tích 4 m². I?", "a": "0,005 W/m²", "opts": ["0,005 W/m²", "0,08 W/m²", "0,02 W/m²", "200 W/m²"], "e": "I = P/S = 0,02/4.", "l": 1}, {"q": "Nguồn điểm đẳng hướng, bỏ qua hấp thụ. Khoảng cách tăng đôi thì I?", "a": "Còn 1/4", "opts": ["Còn 1/4", "Còn 1/2", "Còn 1/8", "Không đổi"], "e": "I=P/(4πr²); diện tích tăng 4 lần.", "l": 1}, {"q": "f = 680 Hz, v = 340 m/s. Hai điểm gần nhất ngược pha trên phương truyền cách?", "a": "0,25 m", "opts": ["0,25 m", "0,5 m", "1 m", "0,125 m"], "e": "λ = 0,5 m; d = λ/2 = 0,25 m.", "l": 2}, {"q": "I = 100I₀. L  "l": 3}]}; const topics=Object.keys(bank);const levels=['Nhận biết','Thông hiểu','Vận dụng','Vận dụng cao'];let topic='Tổng hợp',paper=[],answers={},i=0,stage='menu',filter=false;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>{a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};const scroll=()=>window.scrollTo(0,0);function choose(n){topic=n===-1?'Tổng hợp':topics[n];render()}function start(){let p=topic==='Tổng hợp'?shuffle(topics).flatMap((t,j)=>{let b=bank[t];return [0,1,j<2?3:2].map(l=>shuffle(b.filter(q=>q.l===l))[0])}):bank[topic];paper=shuffle(p).map(q=>({...q,opts:shuffle(q.opts)}));answers={};i=0;filter=false;stage='exam';render();scroll()}function pick(j){answers[i]=paper[i].opts[j];render()}function go(j){i=j;render();scroll()}function submit(){if(Object.keys(answers).length<paper.length&&!confirm('Bạn còn câu chưa trả lời. Nộp bài ngay?'))return;stage='results';render();scroll()}function menu(){stage='menu';render();scroll()}function toggle(){filter=!filter;render()}function render(){if(stage==='menu'){app.innerHTML=`<section><p class="muted">LUYỆN TẬP THEO CHUYÊN ĐỀ</p><h1>Bạn cần ôn phần nào?</h1><p>Chọn một chủ đề để bắt đầu. Câu hỏi và đáp án được xáo trộn mỗi lượt.</p><div class="grid">${topics.map((t,j)=>`<button class="topic ${topic===t?'active':''}" onclick="choose(${j})">${esc(t)}<small>15 câu · 4 mức độ</small></button>`).join('')}<button class="topic ${topic==='Tổng hợp'?'active':''}" onclick="choose(-1)">Tổng ôn toàn chương<small>18 câu · 6 chuyên đề</small></button></div></section><section><div class="row"><div><h2>${esc(topic)}</h2><p class="muted">${topic==='Tổng hợp'?18:15} câu · 25–30 phút gợi ý · chữa từng câu</p></div><button class="btn" onclick="start()">Bắt đầu →</button></div></section>`;return}if(stage==='exam'){const q=paper[i],n=Object.keys(answers).length;app.innerHTML=`<section><div class="row"><strong>${esc(topic)}</strong><span class="muted">${n}/${paper.length} đã làm</span></div><div class="progress"><div style="width:${100*n/paper.length}%"></div></div><div class="nav">${paper.map((_,j)=>`<button class="${answers[j]?'done':''} ${i===j?'now':''}" onclick="go(${j})">${j+1}</button>`).join('')}</div></section><section><p class="muted">Câu ${i+1}/${paper.length}</p><h2>${esc(q.q)}</h2>${q.opts.map((o,j)=>`<button class="opt ${answers[i]===o?'selected':''}" onclick="pick(${j})">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}<div class="row" style="margin-top:20px"><button class="btn secondary" ${i===0?'disabled':''} onclick="go(${i-1})">← Trước</button>${i===paper.length-1?'<button class="btn" onclick="submit()">Nộp bài</button>':`<button class="btn" onclick="go(${i+1})">Tiếp →</button>`}</div></section><div class="row"><button class="btn secondary" onclick="if(confirm('Thoát bài đang làm?'))menu()">Về menu</button><button class="btn" onclick="submit()">Kết thúc bài làm</button></div>`;return}const c=paper.filter((q,j)=>answers[j]===q.a).length;app.innerHTML=`<section><p class="muted">KẾT QUẢ</p><div class="result">${(10*c/paper.length).toFixed(1)} / 10</div><h2>${c}/${paper.length} câu đúng</h2><p>${Object.keys(answers).length-c} sai · ${paper.length-Object.keys(answers).length} bỏ trống</p>${levels.map((l,k)=>{let n=paper.filter(q=>q.l===k).length;let v=paper.filter((q,j)=>q.l===k&&answers[j]===q.a).length;return n?`<div class="row"><span>${l}</span><strong>${v}/${n}</strong></div><div class="progress"><div style="width:${100*v/n}%"></div></div>`:''}).join('')}<div class="row"><button class="btn" onclick="start()">Làm lại</button><button class="btn secondary" onclick="menu()">Đổi chuyên đề</button></div></section><div class="row"><h2>Chữa bài chi tiết</h2><button class="btn secondary" onclick="toggle()">${filter?'Hiện tất cả':'Chỉ câu sai / trống'}</button></div>${paper.map((q,j)=>filter&&answers[j]===q.a?'':`
